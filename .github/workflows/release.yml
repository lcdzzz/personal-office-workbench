name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test dependency
        run: npm install
      - name: Test
        run: npm test
      - name: Package macOS launcher
        run: |
          name="personal-office-workbench-macos-${GITHUB_REF_NAME}"
          mkdir -p "$name"
          cp README.md LICENSE config.example.json personal-office-workbench.html server.py start.sh shutdown.sh "$name/"
          chmod +x "$name/start.sh" "$name/shutdown.sh"
          zip -r "$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-office-workbench-macos-${{ github.ref_name }}
          path: personal-office-workbench-macos-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: personal-office-workbench-macos-${{ github.ref_name }}.zip
